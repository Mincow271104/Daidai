name: Build iOS IPA (Free Sideload)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Select Xcode 16.1 or Higher
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          fi
          xcodebuild -version
          swift --version

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild (Generate iOS native project)
        run: npx expo prebuild --platform ios --clean

      - name: Setup Node Binary for Xcode
        run: |
          cd ios
          echo "export NODE_BINARY=$(which node)" > .xcode.env.local

      - name: CocoaPods Install
        run: |
          cd ios
          pod install
          # Tắt Sandbox của Xcode 16 trên Pods để ReactCodegen được phép ghi file
          sed -i '' 's/ENABLE_USER_SCRIPT_SANDBOXING = YES/ENABLE_USER_SCRIPT_SANDBOXING = NO/g' Pods/Pods.xcodeproj/project.pbxproj || true

      - name: Build Unsigned iOS App
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json 2>/dev/null | python3 -c "import sys, json; data=json.load(sys.stdin); print((data.get('workspace', {}).get('schemes') or data.get('project', {}).get('schemes') or ['DaiDai'])[0])" 2>/dev/null || echo "DaiDai")
          echo "Selected Workspace: $WORKSPACE"
          echo "Selected Scheme: $SCHEME"

          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log || {
              echo "❌ BUILD FAILED! DUMPING RELEVANT ERRORS:"
              grep -E "error:|fatal error:|BUILD FAILED" -A 3 -B 1 xcodebuild.log || tail -n 100 xcodebuild.log
              exit 1
            }

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qr daidai.ipa Payload
          ls -lh daidai.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daidai-ipa
          path: daidai.ipa
          retention-days: 14
