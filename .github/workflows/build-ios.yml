name: Build iOS IPA (Free Sideload)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Select Xcode 16.1
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Download iOS Platform Runtime
        run: sudo xcodebuild -downloadPlatform iOS

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild (Generate iOS native project)
        run: npx expo prebuild --platform ios --clean

      - name: Setup Node Binary for Xcode & Disable Sandbox
        run: |
          cd ios
          # 1. Cố định đường dẫn Node.js cho mọi script build của React Native
          echo "export NODE_BINARY=$(which node)" > .xcode.env.local
          cat .xcode.env.local

          # 2. Cấu hình Podfile tắt triệt để Sandbox của Xcode 16 trên toàn bộ Pod targets
          ruby -e '
            content = File.read("Podfile")
            patch = "    installer.pods_project.targets.each do |target|\n      target.build_configurations.each do |config|\n        config.build_settings[\"ENABLE_USER_SCRIPT_SANDBOXING\"] = \"NO\"\n      end\n    end\n"
            if content.include?("post_install do |installer|")
              content.sub!("post_install do |installer|", "post_install do |installer|\n" + patch)
              File.write("Podfile", content)
              puts "Patched Podfile post_install successfully"
            end
          '

      - name: CocoaPods Install
        run: |
          cd ios
          pod install

      - name: Build Unsigned iOS App
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json 2>/dev/null | python3 -c "import sys, json; data=json.load(sys.stdin); print((data.get('workspace', {}).get('schemes') or data.get('project', {}).get('schemes') or ['DaiDai'])[0])" 2>/dev/null || echo "DaiDai")
          echo "Selected Workspace: $WORKSPACE"
          echo "Selected Scheme: $SCHEME"

          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log || {
              echo "❌ BUILD FAILED! DUMPING RELEVANT ERRORS:"
              grep -E "error:|fatal error:|BUILD FAILED" -A 3 -B 1 xcodebuild.log || tail -n 100 xcodebuild.log
              exit 1
            }

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qr daidai.ipa Payload
          ls -lh daidai.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daidai-ipa
          path: daidai.ipa
          retention-days: 14
