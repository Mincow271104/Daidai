name: Build Android (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Android build profile
        required: true
        type: choice
        default: preview-apk
        options:
          - preview-apk
          - production-aab

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android application
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify EAS setup
        shell: bash
        run: |
          if [[ -z "${EXPO_TOKEN}" ]]; then
            echo "::error::Missing GitHub Actions secret EXPO_TOKEN."
            exit 1
          fi

          node <<'NODE'
          const app = require("./app.json").expo;
          const projectId = app?.extra?.eas?.projectId;

          if (!projectId || typeof projectId !== "string") {
            console.error("EAS project is not linked. Run 'npm run eas:init' locally and commit the generated extra.eas.projectId in app.json.");
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build with EAS
        run: npx --yes eas-cli@latest build --platform android --profile "${{ inputs.profile }}" --non-interactive --wait
